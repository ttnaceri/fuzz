<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart — Fuzz</title>

    <link rel="icon" type="image/png" href="image/logo.png">
    <script src="config.js"></script>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/urlbar.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>

    <!-- URL BAR -->
    <div class="urlbar">
        <button class="urlbar-refresh" id="urlbar-refresh" aria-label="Refresh"><i class="fa-solid fa-rotate-right"></i></button>
        <i class="fa-solid fa-lock urlbar-lock" aria-hidden="true"></i>
        <input type="text" class="urlbar-input" id="urlbar-input" readonly>
        <button class="urlbar-copy" id="urlbar-copy" aria-label="Copy"><i class="fa-regular fa-copy"></i></button>
    </div>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <img src="image/logo.png" alt="Fuzz" class="navbar-logo">
            <span class="navbar-title">Fuzz</span>
        </a>
        <ul class="navbar-links">
            <li><a href="store.html" data-i18n="nav_store">Store</a></li>
            <li><a href="library.html" data-i18n="nav_library">Library</a></li>
            <li><a href="wishlist.html" data-i18n="nav_wishlist">Wishlist</a></li>
            <li><a href="workshop.html" data-i18n="nav_workshop">Workshop</a></li>
        </ul>
        <div class="navbar-actions">
            <a href="#" class="btn-download-fuzz" id="btn-download-fuzz" data-i18n="btn_download_fuzz" aria-label="Download Fuzz">
                <i class="fa-solid fa-download"></i>
                <span data-i18n="btn_download_fuzz">Download Fuzz</span>
            </a>
            <button class="navbar-icon" id="btn-cart" aria-label="Cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge" id="cart-badge" data-count="0">0</span>
            </button>
            <div class="navbar-profile" id="navbar-profile">
                <img src="image/logo.png" alt="Profile" class="navbar-avatar">
                <i class="fa-solid fa-caret-down"></i>
            </div>
        </div>
        <button class="navbar-toggle" id="navbar-toggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
    </nav>

    <!-- MAIN (Steam-style Cart) -->
    <main class="cart-page">
        
        <!-- CHAP: O'yinlar ro'yxati -->
        <div class="cart-main">
            <h1 class="cart-page-title" data-i18n="cart_title">Your Cart</h1>
            <div id="cart-items"></div>
        </div>

        <!-- O'NG: Xulosa (Sticky) -->
        <aside class="cart-summary card">
            <h2 data-i18n="cart_summary">Order Summary</h2>
            
            <div class="cart-summary-row">
                <span data-i18n="cart_subtotal">Subtotal</span>
                <span id="cart-subtotal">$0.00</span>
            </div>
            <div class="cart-summary-row">
                <span data-i18n="cart_tax">Estimated Tax</span>
                <span>$0.00</span>
            </div>
            
            <div class="cart-summary-total">
                <span class="label" data-i18n="cart_total">Total</span>
                <span class="amount" id="cart-total">$0.00</span>
            </div>

            <button class="btn-primary cart-checkout-btn" id="cart-checkout-btn">
                <i class="fa-solid fa-credit-card"></i>
                <span data-i18n="cart_checkout">Checkout</span>
            </button>
            
            <a href="store.html" class="cart-continue-link text-muted" data-i18n="cart_continue">Continue Shopping</a>
        </aside>

    </main>

    <!-- TOAST -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- SCRIPTS -->
    <script src="js/lang.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/urlbar.js"></script>
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
