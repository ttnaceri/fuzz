<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloads — Fuzz</title>
    <link rel="icon" type="image/png" href="image/logo.png">
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/urlbar.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/downloads.css">
    <link rel="stylesheet" href="css/toast.css">
</head>
<body>

    <!-- NAVBAR (boshqa sahifalardagi kabi) -->
    <div class="urlbar">
        <button class="urlbar-refresh" id="urlbar-refresh"><i class="fa-solid fa-rotate-right"></i></button>
        <i class="fa-solid fa-lock urlbar-lock"></i>
        <input type="text" class="urlbar-input" id="urlbar-input" readonly value="https://fuzz.store/downloads/">
        <button class="urlbar-copy" id="urlbar-copy"><i class="fa-regular fa-copy"></i></button>
    </div>

    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <img src="image/logo.png" alt="Fuzz" class="navbar-logo">
            <span class="navbar-title">Fuzz</span>
        </a>
        <ul class="navbar-links">
            <li><a href="store.html" data-i18n="nav_store">Store</a></li>
            <li><a href="library.html" data-i18n="nav_library">Library</a></li>
        </ul>
        <div class="navbar-actions">
            <a href="#" class="btn-download-fuzz" id="btn-download-fuzz" data-i18n="btn_download_fuzz"><i class="fa-solid fa-download"></i> Download Fuzz</a>
            <button class="navbar-icon" id="btn-cart"><i class="fa-solid fa-cart-shopping"></i><span class="cart-badge" id="cart-badge">0</span></button>
            <div class="navbar-profile" id="navbar-profile">
                <img src="image/logo.png" alt="Profile" class="navbar-avatar">
                <i class="fa-solid fa-caret-down"></i>
            </div>
        </div>
    </nav>

    <main class="downloads-page">
        <div class="downloads-header">
            <h1 data-i18n="downloads_title">Downloads</h1>
        </div>

        <div class="downloads-tabs">
            <button class="active" data-i18n="downloads_active">Active</button>
            <button data-i18n="downloads_completed">Completed</button>
        </div>

        <div id="download-list"></div>
    </main>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script src="js/lang.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/urlbar.js"></script>
    <script src="js/store.js"></script>
    <script src="js/downloads.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await FuzzStore.load();
            const listContainer = document.getElementById("download-list");

            function renderDownloads() {
                const downloads = FuzzDownloads.getDownloads();
                listContainer.innerHTML = "";

                if (Object.keys(downloads).length === 0) {
                    listContainer.innerHTML = `<p class="text-muted" style="padding:40px;text-align:center;">No active downloads.</p>`;
                    return;
                }

                Object.values(downloads).forEach(dl => {
                    const game = FuzzStore.getGame(dl.id);
                    if (!game) return;

                    const item = document.createElement("div");
                    item.className = "download-item card";
                    item.innerHTML = `
                        <img src="${game.image}" alt="${game.title}">
                        <div class="download-info">
                            <div class="download-title">${game.title}</div>
                            <div class="download-progress-bar">
                                <div class="download-progress-fill" style="width: ${dl.progress}%;"></div>
                            </div>
                            <div class="download-meta">
                                <span>${dl.status === 'downloading' ? `${dl.speed} MB/s` : dl.status}</span>
                                <span>${dl.progress}%</span>
                            </div>
                        </div>
                        <div class="download-actions">
                            ${dl.status !== 'completed' ? `
                                <button class="btn-ghost" onclick="FuzzDownloads.togglePause('${dl.id}')">
                                    <i class="fa-solid ${dl.status === 'downloading' ? 'fa-pause' : 'fa-play'}"></i>
                                </button>
                            ` : ''}
                            <button class="btn-ghost text-danger" onclick="FuzzDownloads.cancelDownload('${dl.id}')">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    `;
                    listContainer.appendChild(item);
                });
            }

            renderDownloads();
            window.addEventListener("fuzz:downloads-updated", renderDownloads);
        });
    </script>
</body>
</html>
