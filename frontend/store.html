<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store — Fuzz</title>

    <link rel="icon" type="image/png" href="image/logo.png">
    <script src="config.js"></script>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/urlbar.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/store.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>

    <div class="urlbar">
        <button class="urlbar-refresh" id="urlbar-refresh"><i class="fa-solid fa-rotate-right"></i></button>
        <i class="fa-solid fa-lock urlbar-lock"></i>
        <input type="text" class="urlbar-input" id="urlbar-input" readonly>
        <button class="urlbar-copy" id="urlbar-copy"><i class="fa-regular fa-copy"></i></button>
    </div>

    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <img src="image/logo.png" alt="Fuzz" class="navbar-logo">
            <span class="navbar-title">Fuzz</span>
        </a>
        <ul class="navbar-links">
            <li><a href="store.html" data-i18n="nav_store">Store</a></li>
            <li><a href="library.html" data-i18n="nav_library">Library</a></li>
            <li><a href="wishlist.html" data-i18n="nav_wishlist">Wishlist</a></li>
            <li><a href="workshop.html" data-i18n="nav_workshop">Workshop</a></li>
        </ul>
        <div class="navbar-actions">
            <a href="#" class="btn-download-fuzz" id="btn-download-fuzz"
               data-i18n="btn_download_fuzz" aria-label="Download Fuzz">
                <i class="fa-solid fa-download"></i>
                <span data-i18n="btn_download_fuzz">Download Fuzz</span>
            </a>
            <button class="navbar-icon" id="btn-search"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button class="navbar-icon" id="btn-cart"><i class="fa-solid fa-cart-shopping"></i><span class="cart-badge" id="cart-badge" data-count="0">0</span></button>
            <button class="navbar-icon" id="btn-notif"><i class="fa-solid fa-bell"></i></button>
            <div class="navbar-profile" id="navbar-profile">
                <img src="image/logo.png" alt="Profile" class="navbar-avatar">
                <i class="fa-solid fa-caret-down"></i>
            </div>
        </div>
        <button class="navbar-toggle" id="navbar-toggle"><i class="fa-solid fa-bars"></i></button>
    </nav>

    <main class="store">

        <!-- Real-time search -->
        <div class="store-search">
            <i class="fa-solid fa-magnifying-glass store-search-icon"></i>
            <input type="text"
                   class="store-search-input"
                   id="store-search-input"
                   data-i18n-placeholder="search_placeholder"
                   placeholder="Search by name, genre or company…"
                   autocomplete="off">
            <button type="button" class="store-search-clear" id="store-search-clear" aria-label="Clear">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="store-search-results-info" id="store-search-info" style="display:none;"></div>

        <!-- Filters -->
        <section class="filters">
            <input type="text" class="filter-search" placeholder="Search games…" data-i18n-placeholder="filter_search">
            <select class="filter-genre">
                <option value="all" data-i18n="filter_all">All genres</option>
                <option value="Action">Action</option>
                <option value="Puzzle">Puzzle</option>
                <option value="RPG">RPG</option>
                <option value="Strategy">Strategy</option>
                <option value="Zombie">Zombie</option>
                <option value="Zombie Shooter">Zombie Shooter</option>
            </select>
            <select class="filter-price">
                <option value="all" data-i18n="filter_price_all">All prices</option>
                <option value="free" data-i18n="filter_free">Free</option>
                <option value="under5" data-i18n="filter_under_5">Under $5</option>
                <option value="under20" data-i18n="filter_under_20">Under $20</option>
            </select>
        </section>

        <section class="filters-extended card">
            <select class="filter-event" aria-label="Filter by event">
                <option value="all" data-i18n="filter_event">Event</option>
                <option value="sale" data-i18n="deals_title">🔥 Deals</option>
                <option value="popular" data-i18n="filter_popular">Popular</option>
                <option value="new" data-i18n="filter_newest">Newest</option>
            </select>
            <select class="filter-discount" aria-label="Filter by discount">
                <option value="all" data-i18n="filter_discount">Discount</option>
                <option value="any">≥ 1%</option>
                <option value="50plus">≥ 50%</option>
                <option value="70plus">≥ 70%</option>
            </select>
            <select class="filter-company" aria-label="Filter by company">
                <option value="all" data-i18n="filter_company">Company</option>
                <option value="SteelRaven7">SteelRaven7</option>
                <option value="Valve">Valve</option>
                <option value="CI Games">CI Games</option>
                <option value="UPDATE Inc.">UPDATE Inc.</option>
            </select>
            <select class="filter-device" aria-label="Filter by device">
                <option value="all" data-i18n="filter_device_all">All devices</option>
                <option value="desktop" data-i18n="filter_device_desktop">Desktop only</option>
                <option value="mobile" data-i18n="filter_device_mobile">Mobile only</option>
                <option value="both" data-i18n="filter_device_both">Desktop &amp; Mobile</option>
            </select>
        </section>

        <section class="game-grid" id="game-grid"></section>

        <section class="deals">
            <h2 data-i18n="deals_title">🔥 Deals</h2>
            <div class="deals-row" id="deals-row"></div>
        </section>

    </main>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script src="js/lang.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/urlbar.js"></script>
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pwa.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
